[package]
name = "tts-bench-xn"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bench-xn"
path = "src/main.rs"

[dependencies]
ptts = { git = "https://github.com/LaurentMazare/xn-ptts", features = ["sp"] }
xn = { version = "0.1.11", features = ["accelerate"] }
sentencepiece = "0.13.1"
rand = { version = "0.9.0", default-features = false, features = ["std_rng"] }
rand_distr = "0.5.0"
symphonia = { version = "0.5.3", features = ["all"] }
rubato = "0.15.0"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
