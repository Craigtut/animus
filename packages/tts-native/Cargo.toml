[package]
name = "animus-tts-native"
version = "0.4.5"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["async", "tokio_rt"] }
napi-derive = "2"
ptts = { git = "https://github.com/LaurentMazare/xn-ptts", features = ["sp"] }
xn = "0.1.11"
sentencepiece = "0.13.1"
symphonia = { version = "0.5.3", features = ["all"] }
rubato = "0.15.0"
rand = { version = "0.9.0", default-features = false, features = ["std_rng"] }
rand_distr = "0.5.0"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
xn = { version = "0.1.11", features = ["accelerate"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
